name: Build and publish Angular site to /docs

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.angular/**'
      - '.github/workflows/build-and-publish-angular.yml'

permissions:
  contents: write

concurrency:
  group: build-and-publish-angular-main
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: |
          rm -rf docs .pages-build
          npx ng build --configuration production --output-path=.pages-build --base-href=/ng-template-one/
          mv .pages-build/browser docs
          rm -rf .pages-build

      - name: Ensure SPA fallback
        run: cp docs/index.html docs/404.html

      - name: Validate build output
        run: |
          test -s docs/index.html || {
            echo 'Build failed: docs/index.html is missing or empty.' >&2
            exit 1
          }

      - name: Commit and push built docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --quiet --cached; then
            echo 'No docs changes to commit.'
          else
            git commit -m 'chore: build site [skip ci]'
            git push origin HEAD:main
          fi

      - name: Report published site
        run: echo 'Site should be published at: https://carloswm85.github.io/ng-template-one/'
